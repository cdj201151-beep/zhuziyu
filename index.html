<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旗袍尺码推荐</title>

    <!-- PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="旗袍尺码">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 540px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 8px;
        }

        .header .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
        }

        .header .brand .icon {
            font-size: 30px;
        }

        .header .sub {
            color: #86868b;
            font-size: 15px;
            margin-top: 6px;
            font-weight: 400;
        }

        .install-banner {
            display: none;
            background: #0071e3;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .install-banner:hover {
            background: #0060c0;
        }
        .install-banner.show {
            display: block;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .badge {
            font-size: 12px;
            font-weight: 500;
            background: #e8f0fe;
            color: #0071e3;
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: auto;
        }

        .slider-group {
            margin-bottom: 22px;
        }
        .slider-group:last-of-type {
            margin-bottom: 28px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .slider-label {
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .slider-value {
            font-size: 20px;
            font-weight: 600;
            color: #0071e3;
            background: #f0f7ff;
            padding: 0 14px;
            border-radius: 8px;
            line-height: 34px;
            min-width: 68px;
            text-align: center;
        }

        .slider-value .unit {
            font-size: 13px;
            font-weight: 400;
            color: #86868b;
            margin-left: 2px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #e5e5ea;
            outline: none;
            margin-top: 4px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
        }

        .result-area {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 20px 18px 18px;
            text-align: center;
            margin-top: 4px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .result-area.has-result {
            border-color: #0071e3;
            background: #f0f7ff;
        }

        .result-area .result-label {
            font-size: 13px;
            font-weight: 500;
            color: #86868b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .result-area .result-size {
            font-size: 52px;
            font-weight: 700;
            color: #1d1d1f;
            line-height: 1.2;
            margin: 6px 0 2px;
        }

        .result-area .result-size .sub-code {
            font-size: 18px;
            font-weight: 500;
            color: #86868b;
            margin-left: 6px;
        }

        .result-area .result-detail {
            font-size: 14px;
            color: #86868b;
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .result-area .result-detail span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .result-area .result-detail .label { color: #6e6e73; }
        .result-area .result-detail .val { color: #1d1d1f; font-weight: 500; }

        .result-area .result-tip {
            margin-top: 12px;
            padding: 8px 16px;
            background: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            color: #1d1d1f;
            display: inline-block;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .result-area .result-tip .emoji { margin-right: 6px; }

        .result-placeholder {
            color: #aeaeb2;
            font-size: 15px;
            padding: 20px 0 10px;
        }
        .result-placeholder .big {
            font-size: 38px;
            display: block;
            margin-bottom: 8px;
        }

        /* 尺码表 */
        .size-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 4px;
        }

        .size-table th {
            background: #f5f5f7;
            color: #6e6e73;
            font-weight: 500;
            padding: 10px 6px;
            text-align: center;
            font-size: 12px;
            border-bottom: 1px solid #e5e5ea;
        }

        .size-table td {
            padding: 10px 6px;
            text-align: center;
            color: #1d1d1f;
            border-bottom: 1px solid #f2f2f7;
        }

        .size-table tr:last-child td { border-bottom: none; }
        .size-table .highlight-row td {
            background: #e8f0fe;
            font-weight: 600;
            color: #0071e3;
        }

        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: #86868b;
            font-size: 13px;
        }

        @media (max-width: 420px) {
            .result-area .result-size { font-size: 40px; }
            .result-area .result-size .sub-code { font-size: 16px; }
            .card { padding: 18px 14px 22px; }
            .slider-value { font-size: 17px; min-width: 56px; line-height: 30px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <div class="brand">
                <span class="icon">👗</span>
                中国六礼旗袍
            </div>
            <div class="sub">真实买家大数据 · 身高+体重精准匹配</div>
        </div>

        <!-- 安装提示 -->
        <div class="install-banner" id="installBanner">
            ⬇️ 点击此处安装到桌面，像 App 一样使用
        </div>

        <!-- 主卡片：选择身体数据 -->
        <div class="card">
            <div class="card-title">
                📏 选择身体数据
                <span class="badge">智能推荐</span>
            </div>

            <!-- 身高 -->
            <div class="slider-group">
                <div class="slider-header">
                    <span class="slider-label">👤 身高</span>
                    <span class="slider-value" id="heightDisplay">160 <span class="unit">cm</span></span>
                </div>
                <input type="range" id="heightSlider" min="152" max="175" value="160" step="1">
            </div>

            <!-- 体重 -->
            <div class="slider-group">
                <div class="slider-header">
                    <span class="slider-label">⚖️ 体重</span>
                    <span class="slider-value" id="weightDisplay">120 <span class="unit">斤</span></span>
                </div>
                <input type="range" id="weightSlider" min="80" max="240" value="120" step="1">
            </div>

            <!-- 推荐结果 -->
            <div class="result-area" id="resultArea">
                <div class="result-placeholder" id="placeholder">
                    <span class="big">👆</span>
                    调整滑块 · 尺码即刻推荐
                </div>
                <div id="resultContent" style="display: none;">
                    <div class="result-label">✨ 推荐尺码</div>
                    <div class="result-size" id="resultSize">3XL <span class="sub-code">(158-168cm / 122-130斤)</span></div>
                    <div class="result-detail" id="resultDetail">
                        <span><span class="label">身高</span> <span class="val" id="detailHeight">158-168</span> cm</span>
                        <span><span class="label">体重</span> <span class="val" id="detailWeight">122-130</span> 斤</span>
                    </div>
                    <div class="result-tip" id="resultTip">
                        <span class="emoji">✅</span> 标准尺码，可按习惯购买
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片：尺码对照表 -->
        <div class="card">
            <div class="card-title">
                📋 尺码对照表
                <span class="badge">参考</span>
            </div>
            <table class="size-table" id="sizeTable">
                <thead>
                    <tr>
                        <th>尺码</th>
                        <th>身高 (cm)</th>
                        <th>体重 (斤)</th>
                    </tr>
                </thead>
                <tbody id="sizeTableBody">
                    <!-- JS 渲染 -->
                </tbody>
            </table>
            <div style="font-size:12px; color:#aeaeb2; margin-top:12px; text-align:center;">
                基于真实买家大数据，仅供参考
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            Copyright © 2026 中国六礼旗袍 · 可安装到桌面
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 尺码数据（基于真实买家大数据）
        // ============================================================
        const SIZE_DATA = [
            { code: 'M',   label: 'M',   heightMin: 152, heightMax: 160, weightMin: 80,  weightMax: 100 },
            { code: 'L',   label: 'L',   heightMin: 153, heightMax: 163, weightMin: 100, weightMax: 110 },
            { code: 'XL',  label: 'XL',  heightMin: 155, heightMax: 164, weightMin: 110, weightMax: 115 },
            { code: '2XL', label: '2XL', heightMin: 156, heightMax: 165, weightMin: 115, weightMax: 122 },
            { code: '3XL', label: '3XL', heightMin: 158, heightMax: 168, weightMin: 122, weightMax: 130 },
            { code: '4XL', label: '4XL', heightMin: 160, heightMax: 170, weightMin: 130, weightMax: 145 },
            { code: '5XL', label: '5XL', heightMin: 160, heightMax: 172, weightMin: 145, weightMax: 168 },
            { code: '6XL', label: '6XL', heightMin: 162, heightMax: 173, weightMin: 168, weightMax: 185 },
            { code: '7XL', label: '7XL', heightMin: 162, heightMax: 174, weightMin: 185, weightMax: 202 },
            { code: '8XL', label: '8XL', heightMin: 163, heightMax: 175, weightMin: 202, weightMax: 220 },
            { code: '9XL', label: '9XL', heightMin: 164, heightMax: 175, weightMin: 220, weightMax: 240 },
        ];

        // ============================================================
        //  2. DOM 引用
        // ============================================================
        const heightSlider = document.getElementById('heightSlider');
        const weightSlider = document.getElementById('weightSlider');
        const heightDisplay = document.getElementById('heightDisplay');
        const weightDisplay = document.getElementById('weightDisplay');
        const resultArea = document.getElementById('resultArea');
        const placeholder = document.getElementById('placeholder');
        const resultContent = document.getElementById('resultContent');
        const resultSize = document.getElementById('resultSize');
        const detailHeight = document.getElementById('detailHeight');
        const detailWeight = document.getElementById('detailWeight');
        const resultTip = document.getElementById('resultTip');
        const sizeTableBody = document.getElementById('sizeTableBody');

        // ============================================================
        //  3. 核心推荐函数（同时考虑身高和体重）
        // ============================================================
        function recommendSize(height, weight) {
            // 先找完全匹配
            for (const s of SIZE_DATA) {
                if (weight >= s.weightMin && weight < s.weightMax &&
                    height >= s.heightMin && height < s.heightMax) {
                    return { ...s, tip: '✅ 完美匹配！身高体重均在推荐区间内', matchType: 'perfect' };
                }
            }

            // 再找体重匹配
            let weightMatch = null;
            for (const s of SIZE_DATA) {
                if (weight >= s.weightMin && weight < s.weightMax) {
                    weightMatch = s;
                    break;
                }
            }
            if (weightMatch) {
                let tip = '体重匹配，但身高不在推荐区间内，建议试穿';
                if (height < weightMatch.heightMin) tip = '身高偏低，建议选小一码试穿';
                else if (height > weightMatch.heightMax) tip = '身高偏高，建议选大一码试穿';
                return { ...weightMatch, tip: '⚠️ ' + tip, matchType: 'weight-only' };
            }

            // 体重完全超范围，取最近的
            let closest = null;
            let minDiff = Infinity;
            for (const s of SIZE_DATA) {
                let diff = 0;
                if (weight < s.weightMin) diff = s.weightMin - weight;
                else if (weight >= s.weightMax) diff = weight - s.weightMax + 1;
                if (diff < minDiff) { minDiff = diff; closest = s; }
            }
            if (closest) {
                return { ...closest, tip: '📌 体重超出常规范围，建议参考尺码表或咨询客服', matchType: 'fallback' };
            }

            // 兜底
            return {
                code: '3XL', label: '3XL', heightMin: 158, heightMax: 168,
                weightMin: 122, weightMax: 130,
                tip: '建议参考尺码表或咨询客服', matchType: 'fallback'
            };
        }

        // ============================================================
        //  4. 更新 UI（使用 requestAnimationFrame 优化）
        // ============================================================
        let animationFrameId = null;

        function updateRecommendation() {
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            animationFrameId = requestAnimationFrame(() => {
                const height = parseInt(heightSlider.value, 10);
                const weight = parseInt(weightSlider.value, 10);

                heightDisplay.innerHTML = `${height} <span class="unit">cm</span>`;
                weightDisplay.innerHTML = `${weight} <span class="unit">斤</span>`;

                const result = recommendSize(height, weight);

                placeholder.style.display = 'none';
                resultContent.style.display = 'block';
                resultArea.classList.add('has-result');

                const mainSize = result.code || result.label;
                const subLabel = `(${result.heightMin}-${result.heightMax}cm / ${result.weightMin}-${result.weightMax}斤)`;
                resultSize.innerHTML = `${mainSize} <span class="sub-code">${subLabel}</span>`;

                detailHeight.textContent = `${result.heightMin}-${result.heightMax}`;
                let wRange = `${result.weightMin}-${result.weightMax}`;
                if (result.weightMin === 0) wRange = `< ${result.weightMax}`;
                if (result.weightMax === 999) wRange = `≥ ${result.weightMin}`;
                detailWeight.textContent = wRange;

                let tipText = result.tip || '标准尺码，可按习惯购买';
                if (result.matchType === 'perfect') {
                    tipText = '✅ 完美匹配！身高体重均在推荐区间内';
                } else if (result.matchType === 'weight-only') {
                    tipText = '⚠️ ' + tipText;
                } else {
                    tipText = '📌 ' + tipText;
                }
                resultTip.innerHTML = `<span class="emoji">💡</span> ${tipText}`;

                highlightTableRow(result.code);

                animationFrameId = null;
            });
        }

        // ============================================================
        //  5. 尺码表高亮
        // ============================================================
        function highlightTableRow(sizeCode) {
            document.querySelectorAll('.highlight-row').forEach(row => row.classList.remove('highlight-row'));
            const targetRow = document.querySelector(`tr[data-size="${sizeCode}"]`);
            if (targetRow) targetRow.classList.add('highlight-row');
        }

        // ============================================================
        //  6. 渲染尺码表
        // ============================================================
        function renderSizeTable() {
            let html = '';
            for (const s of SIZE_DATA) {
                html += `
                    <tr data-size="${s.code}">
                        <td class="size-code">${s.code}</td>
                        <td>${s.heightMin}-${s.heightMax}</td>
                        <td>${s.weightMin}-${s.weightMax}</td>
                    </tr>
                `;
            }
            sizeTableBody.innerHTML = html;
            setTimeout(() => {
                const result = recommendSize(160, 120);
                highlightTableRow(result.code);
            }, 50);
        }

        // ============================================================
        //  7. 事件绑定 & 初始化
        // ============================================================
        heightSlider.addEventListener('input', updateRecommendation);
        weightSlider.addEventListener('input', updateRecommendation);

        renderSizeTable();
        setTimeout(updateRecommendation, 100);

        // ============================================================
        //  8. PWA 安装逻辑
        // ============================================================
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBanner.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                installBanner.classList.remove('show');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('show');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        console.log('👗 旗袍尺码推荐工具（大数据版，无用户参考）已加载');
    </script>

</body>
</html>
