<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旗袍尺码推荐</title>

    <!-- PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="旗袍尺码">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">

    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 540px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 8px;
        }

        .header .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
        }

        .header .brand .icon {
            font-size: 30px;
        }

        .header .sub {
            color: #86868b;
            font-size: 15px;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ===== 安装提示 ===== */
        .install-banner {
            display: none;
            background: #0071e3;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .install-banner:hover {
            background: #0060c0;
        }
        .install-banner.show {
            display: block;
        }

        /* ===== 主卡片 ===== */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .badge {
            font-size: 12px;
            font-weight: 500;
            background: #e8f0fe;
            color: #0071e3;
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: auto;
        }

        /* ===== 滑块组 ===== */
        .slider-group {
            margin-bottom: 22px;
        }

        .slider-group:last-of-type {
            margin-bottom: 28px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .slider-label {
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .slider-value {
            font-size: 20px;
            font-weight: 600;
            color: #0071e3;
            background: #f0f7ff;
            padding: 0 14px;
            border-radius: 8px;
            line-height: 34px;
            min-width: 68px;
            text-align: center;
        }

        .slider-value .unit {
            font-size: 13px;
            font-weight: 400;
            color: #86868b;
            margin-left: 2px;
        }

        /* 自定义滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #e5e5ea;
            outline: none;
            transition: background 0.2s;
            margin-top: 4px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.45);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0071e3;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
        }

        input[type="range"]:focus {
            outline: none;
        }

        /* ===== 推荐结果 ===== */
        .result-area {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 20px 18px 18px;
            text-align: center;
            margin-top: 4px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .result-area.has-result {
            border-color: #0071e3;
            background: #f0f7ff;
        }

        .result-area .result-label {
            font-size: 13px;
            font-weight: 500;
            color: #86868b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .result-area .result-size {
            font-size: 52px;
            font-weight: 700;
            color: #1d1d1f;
            line-height: 1.2;
            margin: 6px 0 2px;
        }

        .result-area .result-size .sub-code {
            font-size: 24px;
            font-weight: 500;
            color: #86868b;
            margin-left: 6px;
        }

        .result-area .result-detail {
            font-size: 14px;
            color: #86868b;
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .result-area .result-detail span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .result-area .result-detail .label {
            color: #6e6e73;
        }

        .result-area .result-detail .val {
            color: #1d1d1f;
            font-weight: 500;
        }

        .result-area .result-tip {
            margin-top: 12px;
            padding: 8px 16px;
            background: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            color: #1d1d1f;
            display: inline-block;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .result-area .result-tip .emoji {
            margin-right: 6px;
        }

        .result-placeholder {
            color: #aeaeb2;
            font-size: 15px;
            padding: 20px 0 10px;
        }

        .result-placeholder .big {
            font-size: 38px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== 尺码对照表 ===== */
        .size-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 4px;
        }

        .size-table th {
            background: #f5f5f7;
            color: #6e6e73;
            font-weight: 500;
            padding: 10px 6px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #e5e5ea;
        }

        .size-table td {
            padding: 10px 6px;
            text-align: center;
            color: #1d1d1f;
            border-bottom: 1px solid #f2f2f7;
            font-weight: 450;
        }

        .size-table tr:last-child td {
            border-bottom: none;
        }

        .size-table .highlight-row td {
            background: #e8f0fe;
            border-radius: 8px;
            font-weight: 600;
            color: #0071e3;
        }

        .size-table .size-code {
            font-weight: 600;
            color: #1d1d1f;
        }

        /* ===== 用户参考 ===== */
        .user-refs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .user-ref-item {
            background: #f8f9fc;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background 0.15s;
        }

        .user-ref-item .info {
            color: #1d1d1f;
        }

        .user-ref-item .info .height-weight {
            font-weight: 500;
        }

        .user-ref-item .info .detail {
            color: #86868b;
            font-size: 11px;
            margin-left: 4px;
        }

        .user-ref-item .ref-size {
            font-weight: 600;
            color: #0071e3;
            background: #e8f0fe;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        .user-ref-more {
            text-align: center;
            color: #86868b;
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f2f2f7;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: #86868b;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .result-area .result-size {
                font-size: 40px;
            }
            .result-area .result-size .sub-code {
                font-size: 20px;
            }
            .user-refs {
                grid-template-columns: 1fr;
            }
            .result-area .result-detail {
                gap: 10px;
                font-size: 13px;
            }
            .card {
                padding: 18px 14px 22px;
            }
            .slider-value {
                font-size: 17px;
                min-width: 56px;
                line-height: 30px;
            }
        }

        @media (min-width: 600px) {
            .user-refs {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* ===== 工具类 ===== */
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #86868b;
        }
        .fw-600 {
            font-weight: 600;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f7;
        }
        ::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="brand">
                <span class="icon">👗</span>
                中国六礼旗袍
            </div>
            <div class="sub">智能尺码推荐 · 根据身高体重精准匹配</div>
        </div>

        <!-- ===== 安装提示 ===== -->
        <div class="install-banner" id="installBanner">
            ⬇️ 点击此处安装到桌面，像 App 一样使用
        </div>

        <!-- ===== 主卡片：尺码选择 ===== -->
        <div class="card">
            <div class="card-title">
                📏 选择身体数据
                <span class="badge">智能推荐</span>
            </div>

            <!-- 身高 -->
            <div class="slider-group">
                <div class="slider-header">
                    <span class="slider-label">👤 身高</span>
                    <span class="slider-value" id="heightDisplay">160 <span class="unit">cm</span></span>
                </div>
                <input type="range" id="heightSlider" min="145" max="175" value="160" step="1">
            </div>

            <!-- 体重 -->
            <div class="slider-group">
                <div class="slider-header">
                    <span class="slider-label">⚖️ 体重</span>
                    <span class="slider-value" id="weightDisplay">120 <span class="unit">斤</span></span>
                </div>
                <input type="range" id="weightSlider" min="85" max="180" value="120" step="1">
            </div>

            <!-- 推荐结果 -->
            <div class="result-area" id="resultArea">
                <div class="result-placeholder" id="placeholder">
                    <span class="big">👆</span>
                    调整滑块 · 尺码即刻推荐
                </div>
                <div id="resultContent" style="display: none;">
                    <div class="result-label">✨ 推荐尺码</div>
                    <div class="result-size" id="resultSize">3XL <span class="sub-code">(180)</span></div>
                    <div class="result-detail" id="resultDetail">
                        <span><span class="label">身高</span> <span class="val" id="detailHeight">150-170</span> cm</span>
                        <span><span class="label">体重</span> <span class="val" id="detailWeight">140-150</span> 斤</span>
                    </div>
                    <div class="result-tip" id="resultTip">
                        <span class="emoji">✅</span> 标准尺码，可按习惯购买
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 卡片：尺码对照表 ===== -->
        <div class="card">
            <div class="card-title">
                📋 尺码对照表
                <span class="badge">参考</span>
            </div>
            <table class="size-table" id="sizeTable">
                <thead>
                    <tr>
                        <th>尺码</th>
                        <th>身高 (cm)</th>
                        <th>体重 (斤)</th>
                    </tr>
                </thead>
                <tbody id="sizeTableBody">
                    <!-- JS 渲染 -->
                </tbody>
            </table>
            <div style="font-size:12px; color:#aeaeb2; margin-top:12px; text-align:center;">
                手工测量存在细微误差，仅供参考
            </div>
        </div>

        <!-- ===== 卡片：已购用户参考 ===== -->
        <div class="card">
            <div class="card-title">
                👥 已购用户参考
                <span class="badge">真实数据</span>
            </div>
            <div class="user-refs" id="userRefs">
                <!-- JS 渲染 -->
            </div>
            <div class="user-ref-more">
                以上信息来源于已购用户，仅供参考
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            Copyright © 2026 中国六礼旗袍 · 可安装到桌面
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 尺码数据（基于第三张图）
        // ============================================================
        const SIZE_DATA = [
            { code: 'M', label: '160', heightMin: 150, heightMax: 170, weightMin: 100, weightMax: 110 },
            { code: 'L', label: '165', heightMin: 150, heightMax: 170, weightMin: 110, weightMax: 120 },
            { code: 'XL', label: '170', heightMin: 150, heightMax: 170, weightMin: 120, weightMax: 130 },
            { code: '2XL', label: '175', heightMin: 150, heightMax: 170, weightMin: 130, weightMax: 140 },
            { code: '3XL', label: '180', heightMin: 150, heightMax: 170, weightMin: 140, weightMax: 150 },
            { code: '4XL', label: '185', heightMin: 150, heightMax: 170, weightMin: 150, weightMax: 160 },
            { code: '5XL', label: '190', heightMin: 150, heightMax: 170, weightMin: 160, weightMax: 170 },
        ];

        // ============================================================
        //  2. 用户参考数据（从第一、二张图提取）
        // ============================================================
        const USER_REFS = [
            { height: 160, weight: 112, size: '2XL' },
            { height: 157, weight: 110, size: '2XL' },
            { height: 162, weight: 122, size: '3XL' },
            { height: 161, weight: 114, size: '3XL' },
            { height: 159, weight: 114, size: '3XL' },
            { height: 161, weight: 122, size: '5XL' },
            { height: 160, weight: 132, size: '5XL' },
            { height: 158, weight: 138, size: '5XL' },
            { height: 162, weight: 130, size: '5XL' },
            { height: 159, weight: 144, size: '5XL' },
            { height: 160, weight: 118, size: '2XL' },
            { height: 165, weight: 140, size: '2XL' },
            { height: 162, weight: 116, size: '3XL' },
            { height: 161, weight: 124, size: '3XL' },
            { height: 167, weight: 132, size: '4XL' },
            { height: 160, weight: 126, size: '4XL' },
            { height: 167, weight: 148, size: '4XL' },
            { height: 171, weight: 168, size: '5XL' },
            { height: 167, weight: 168, size: '5XL' },
        ];

        // ============================================================
        //  3. DOM 引用
        // ============================================================
        const heightSlider = document.getElementById('heightSlider');
        const weightSlider = document.getElementById('weightSlider');
        const heightDisplay = document.getElementById('heightDisplay');
        const weightDisplay = document.getElementById('weightDisplay');
        const resultArea = document.getElementById('resultArea');
        const placeholder = document.getElementById('placeholder');
        const resultContent = document.getElementById('resultContent');
        const resultSize = document.getElementById('resultSize');
        const detailHeight = document.getElementById('detailHeight');
        const detailWeight = document.getElementById('detailWeight');
        const resultTip = document.getElementById('resultTip');
        const sizeTableBody = document.getElementById('sizeTableBody');
        const userRefsContainer = document.getElementById('userRefs');

        // ============================================================
        //  4. 核心推荐函数
        // ============================================================
        function recommendSize(height, weight) {
            // 如果体重超出范围，给出特殊提示
            if (weight < 100) {
                return {
                    size: 'M 或更小',
                    label: '—',
                    heightMin: 150,
                    heightMax: 170,
                    weightMin: 0,
                    weightMax: 100,
                    tip: '体重偏轻，建议选择 M 码或更小码，具体请参考试穿'
                };
            }
            if (weight > 170) {
                return {
                    size: '5XL 或更大',
                    label: '190+',
                    heightMin: 150,
                    heightMax: 170,
                    weightMin: 170,
                    weightMax: 999,
                    tip: '体重偏重，建议选择 5XL 或更大码，具体请参考试穿'
                };
            }

            // 身高超出范围提示
            let heightNote = '';
            if (height < 150) {
                heightNote = ' (身高偏矮，建议选小一码)';
            } else if (height > 170) {
                heightNote = ' (身高偏高，建议选大一码)';
            }

            // 根据体重查找尺码
            for (const s of SIZE_DATA) {
                if (weight >= s.weightMin && weight < s.weightMax) {
                    let tip = '标准尺码，可按习惯购买';
                    if (height < 150) {
                        tip = '身高偏矮，建议选小一码试穿';
                    } else if (height > 170) {
                        tip = '身高偏高，建议选大一码试穿';
                    }
                    return {
                        ...s,
                        tip: tip + heightNote,
                        heightNote: heightNote
                    };
                }
            }

            // fallback
            return {
                size: '3XL',
                label: '180',
                heightMin: 150,
                heightMax: 170,
                weightMin: 140,
                weightMax: 150,
                tip: '建议参考尺码表或咨询客服'
            };
        }

        // ============================================================
        //  5. 更新 UI
        // ============================================================
        function updateRecommendation() {
            const height = parseInt(heightSlider.value, 10);
            const weight = parseInt(weightSlider.value, 10);

            // 更新显示
            heightDisplay.innerHTML = `${height} <span class="unit">cm</span>`;
            weightDisplay.innerHTML = `${weight} <span class="unit">斤</span>`;

            // 推荐
            const result = recommendSize(height, weight);

            // 显示结果
            placeholder.style.display = 'none';
            resultContent.style.display = 'block';
            resultArea.classList.add('has-result');

            // 尺码展示
            const sizeParts = result.size.split(' ');
            const mainSize = sizeParts[0] || result.size;
            const subLabel = result.label ? `(${result.label})` : '';
            resultSize.innerHTML = `${mainSize} <span class="sub-code">${subLabel}</span>`;

            // 详情
            let hRange = `${result.heightMin}-${result.heightMax}`;
            let wRange = `${result.weightMin}-${result.weightMax}`;
            if (result.weightMin === 0) {
                wRange = `< ${result.weightMax}`;
            }
            if (result.weightMax === 999) {
                wRange = `≥ ${result.weightMin}`;
            }
            detailHeight.textContent = hRange;
            detailWeight.textContent = wRange;

            // 提示
            resultTip.innerHTML = `<span class="emoji">✅</span> ${result.tip || '标准尺码，可按习惯购买'}`;

            // 高亮尺码表对应行
            highlightTableRow(result.size, result.label);
        }

        // ============================================================
        //  6. 尺码表高亮
        // ============================================================
        function highlightTableRow(sizeCode, label) {
            const rows = sizeTableBody.querySelectorAll('tr');
            rows.forEach(row => {
                row.classList.remove('highlight-row');
                const td = row.querySelector('.size-code');
                if (td) {
                    const text = td.textContent.trim();
                    // 匹配 "3XL (180)" 或 "3XL"
                    const match = text.match(/^([^\s(]+)/);
                    if (match) {
                        const code = match[1];
                        if (code === sizeCode || text.includes(sizeCode)) {
                            row.classList.add('highlight-row');
                        }
                    }
                    // 特殊处理 "M 或更小" / "5XL 或更大"
                    if (sizeCode === 'M 或更小' && text.startsWith('M')) {
                        row.classList.add('highlight-row');
                    }
                    if (sizeCode === '5XL 或更大' && text.startsWith('5XL')) {
                        row.classList.add('highlight-row');
                    }
                }
            });
        }

        // ============================================================
        //  7. 渲染尺码表
        // ============================================================
        function renderSizeTable() {
            let html = '';
            for (const s of SIZE_DATA) {
                html += `
                    <tr>
                        <td class="size-code">${s.code} (${s.label})</td>
                        <td>${s.heightMin}-${s.heightMax}</td>
                        <td>${s.weightMin}-${s.weightMax}</td>
                    </tr>
                `;
            }
            sizeTableBody.innerHTML = html;

            // 默认高亮（基于初始值 160/120）
            setTimeout(() => {
                const result = recommendSize(160, 120);
                highlightTableRow(result.size, result.label);
            }, 50);
        }

        // ============================================================
        //  8. 渲染用户参考
        // ============================================================
        function renderUserRefs() {
            // 随机打乱并取前 12 个，让展示更多样
            const shuffled = [...USER_REFS].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, 12);

            let html = '';
            for (const u of selected) {
                html += `
                    <div class="user-ref-item">
                        <span class="info">
                            <span class="height-weight">${u.height}cm ${u.weight}斤</span>
                            <span class="detail">→</span>
                        </span>
                        <span class="ref-size">${u.size}</span>
                    </div>
                `;
            }
            userRefsContainer.innerHTML = html;
        }

        // ============================================================
        //  9. 事件绑定
        // ============================================================
        heightSlider.addEventListener('input', updateRecommendation);
        weightSlider.addEventListener('input', updateRecommendation);

        // 初始渲染
        renderSizeTable();
        renderUserRefs();
        updateRecommendation();

        // ============================================================
        //  10. PWA 安装逻辑（参考 index.html）
        // ============================================================
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBanner.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                installBanner.classList.remove('show');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('show');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // ============================================================
        //  11. 窗口 resize 时保持 UI 整洁（无额外操作）
        // ============================================================
        console.log('👗 旗袍尺码推荐工具已加载');
        console.log('📐 身高范围: 145-175 cm, 体重范围: 85-180 斤');
    </script>

</body>
